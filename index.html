<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="color-scheme" content="dark">
  <title>QRsec</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #101010;
      --border: #2c2c2c;
      --border-strong: #565656;
      --text: #f2f2f2;
      --muted: #8a8a8a;
      --invert-bg: #f2f2f2;
      --invert-fg: #0a0a0a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem 1rem;
    }

    ::selection { background: var(--text); color: var(--bg); }

    button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 1px solid var(--text);
      outline-offset: 2px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      padding: 1.5rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--text);
      padding-bottom: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .lang-switch {
      display: flex;
      border: 1px solid var(--border-strong);
      background: var(--bg);
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.25rem 0.45rem;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .lang-btn:not(:last-child) {
      border-right: 1px solid var(--border-strong);
    }

    .lang-btn:hover:not(.active) {
      color: var(--text);
    }

    .lang-btn.active {
      background: var(--invert-bg);
      color: var(--invert-fg);
    }

    .badge-bar {
      margin-top: -0.75rem;
      margin-bottom: 1.25rem;
      display: flex;
      justify-content: flex-start;
    }

    .badge {
      font-size: 0.65rem;
      padding: 0.2rem 0.45rem;
      border: 1px solid var(--border-strong);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.45rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .field-group { margin-bottom: 1.25rem; }

    textarea, input[type="text"], input[type="password"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.75rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    textarea:focus, input:focus { border-color: var(--text); }
    textarea { resize: vertical; min-height: 80px; }

    textarea[readonly] {
      color: var(--muted);
      font-size: 0.72rem;
      word-break: break-all;
      min-height: 64px;
      resize: none;
    }

    .input-with-action {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-with-action input { padding-right: 2.8rem; }

    .btn-toggle-eye {
      position: absolute;
      right: 0.4rem;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 0.45rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-toggle-eye:hover { color: var(--text); }

    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.4rem;
      letter-spacing: 0.05em;
    }

    .meta-warning { color: var(--text); font-weight: 700; }

    .btn-row {
      display: flex;
      gap: 1px;
      margin-top: 0.4rem;
      background: var(--border-strong);
      border: 1px solid var(--border-strong);
    }

    .mode-switch, .role-switch {
      margin-top: 0;
      margin-bottom: 1.25rem;
    }

    .btn-sm {
      flex: 1;
      padding: 0.55rem 0.4rem;
      font-size: 0.7rem;
      font-family: inherit;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      min-height: 36px;
      background: var(--surface);
      border: none;
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .btn-sm:hover { background: var(--text); color: var(--invert-fg); }
    .btn-sm.active { background: var(--invert-bg); color: var(--invert-fg); font-weight: 700; }

    .btn-primary {
      width: 100%;
      min-height: 48px;
      margin-top: 0.25rem;
      background: var(--invert-bg);
      color: var(--invert-fg);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-decoration: none;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn-primary:hover { box-shadow: 4px 4px 0 var(--border-strong); }
    .btn-primary:active { transform: translate(2px, 2px); box-shadow: none; }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; transform: none; }

    .btn-danger { color: var(--text); }
    .btn-danger:hover { background: var(--invert-bg); color: var(--invert-fg); }

    #qr-output, #pair-output {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-strong);
    }

    #pair-output > textarea,
    #pair-output > .btn-row,
    #pair-output > label,
    #pair-output > .btn-primary,
    #pair-output > .status-msg {
      width: 100%;
    }

    .qr-frame {
      background: #fff;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      max-width: 100%;
      box-shadow: 8px 8px 0 var(--border);
      margin-bottom: 1rem;
    }

    .qr-frame:empty {
      display: none;
    }

    .qr-frame canvas,
    .qr-frame img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .tap-box {
      width: 100%;
      min-height: 110px;
      background: var(--bg);
      border: 1px dashed var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1rem;
      font-size: 0.95rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    .tap-box.revealed {
      border-style: solid;
      border-color: var(--text);
      color: var(--text);
      word-break: break-all;
      user-select: text;
      -webkit-user-select: text;
      touch-action: auto;
    }

    .status-msg {
      margin-top: 0.75rem;
      padding: 0.6rem;
      font-size: 0.8rem;
      letter-spacing: 0.03em;
      text-align: center;
      line-height: 1.4;
    }

    .status-error { background: var(--invert-bg); color: var(--invert-fg); font-weight: 700; }
    .status-info { border: 1px solid var(--border-strong); color: var(--muted); }

    .nav-link {
      display: block;
      margin-top: 1.25rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      text-decoration: underline;
      cursor: pointer;
      letter-spacing: 0.05em;
    }
    .nav-link:hover { color: var(--text); }

    input[type="file"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      padding: 0.55rem;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      color: var(--text);
      font-family: inherit;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.45rem 0.8rem;
      cursor: pointer;
      margin-right: 0.75rem;
      transition: background 0.15s ease, color 0.15s ease;
    }

    input[type="file"]::file-selector-button:hover {
      background: var(--invert-bg);
      color: var(--invert-fg);
    }

    .progress {
      width: 100%;
      height: 14px;
      border: 1px solid var(--border-strong);
      background: var(--bg);
      margin-top: 0.5rem;
    }

    .progress > div {
      height: 100%;
      width: 0%;
      background: var(--text);
      transition: width 0.15s linear;
    }

    .app-footer {
      margin-top: 1.5rem;
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
      font-size: 0.7rem;
      color: var(--muted);
    }

    .footer-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      list-style: none;
      user-select: none;
      -webkit-user-select: none;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0.25rem 0;
    }

    .footer-summary::-webkit-details-marker { display: none; }
    .footer-summary:hover { color: var(--text); }
    .summary-icon { transition: transform 0.2s ease; }
    .app-footer[open] .summary-icon { transform: rotate(180deg); }

    .footer-content {
      padding-top: 0.75rem;
      line-height: 1.45;
      letter-spacing: 0.02em;
    }

    .footer-content p { margin-bottom: 0.5rem; }
    .footer-content p:last-child { margin-bottom: 0; }
    .footer-content code {
      color: var(--text);
      background: var(--bg);
      padding: 0.1rem 0.25rem;
      border: 1px solid var(--border);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-left">
      <h1>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M4 4h6v6H4V4zm2 2v2h2V6H6zm8-2h6v6h-6V4zm2 2v2h2V6h-2zM4 14h6v6H4v-6zm2 2v2h2v-2H6zm10 0h2v2h-2v-2zm-2 2h2v2h-2v-2zm4 0h2v2h-2v-2zm-2-4h2v2h-2v-2zm4-2h2v2h-2v-2z"/>
        </svg>
        QRsec
      </h1>
    </div>
    <div class="lang-switch" role="group" aria-label="Language selection">
      <button type="button" class="lang-btn active" data-lang="ru">RU</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="zh">ZH</button>
    </div>
  </header>

  <div class="badge-bar">
    <span class="badge" id="env-badge" data-i18n="env_badge">безопасная передача данных</span>
  </div>

  <div class="btn-row mode-switch" role="tablist" aria-label="Mode">
    <button type="button" class="btn-sm active" id="tab-text" data-i18n="tab_text">Текст</button>
    <button type="button" class="btn-sm" id="tab-file" data-i18n="tab_file">Файл</button>
  </div>

  <!-- ==================== TEXT MODE ==================== -->
  <section id="text-mode">
    <section id="sender-ui">
      <div class="field-group">
        <label for="plain-input" data-i18n="label_plain">Данные (UTF-8)</label>
        <textarea id="plain-input" data-i18n-ph="ph_plain" placeholder="Что шифруем?"></textarea>
        <div class="meta-row">
          <span id="bytes-counter">0 / 1024 байт</span>
          <span id="qr-hint" data-i18n="qr_hint_empty">QR: внесите данные</span>
        </div>
      </div>

      <div class="field-group">
        <label for="pass-input" data-i18n="label_pass">Код доступа</label>
        <div class="input-with-action">
          <input type="password" id="pass-input" data-i18n-ph="ph_pass" placeholder="Код или фраза" autocomplete="new-password">
          <button type="button" class="btn-toggle-eye" id="toggle-pass-btn" title="Показать/скрыть">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <div class="btn-row">
          <button type="button" class="btn-sm" id="gen-pin-6">PIN 6</button>
          <button type="button" class="btn-sm" id="gen-pin-8">PIN 8</button>
          <button type="button" class="btn-sm" id="gen-word-8">Text PIN</button>
        </div>
      </div>

      <button type="button" class="btn-primary" id="btn-build" data-i18n="btn_build">Сформировать QR</button>

      <div id="sender-error" class="status-msg status-error hidden"></div>

      <div id="qr-output" class="hidden">
        <div class="qr-frame" id="qr-target"></div>
        
        <div class="btn-row" style="width: 100%; margin-top: 0;">
          <button type="button" class="btn-sm" id="btn-download-qr">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span data-i18n="btn_download_qr">Скачать QR</span>
          </button>
          <button type="button" class="btn-sm" id="btn-share-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            <span id="btn-share-text" data-i18n="btn_share_link">Поделиться ссылкой</span>
          </button>
        </div>

        <div class="meta-row" style="width:100%; margin-top:0.75rem;">
          <span id="timer-sender">Сброс через: 60 с</span>
        </div>
      </div>
    </section>

    <section id="receiver-ui" class="hidden">
      <div class="field-group">
        <label for="unlock-code" data-i18n="label_unlock">Код доступа к данным</label>
        <div class="input-with-action">
          <input type="password" id="unlock-code" data-i18n-ph="ph_unlock" placeholder="Введите код" autocomplete="current-password">
          <button type="button" class="btn-toggle-eye" id="toggle-unlock-btn" title="Показать/скрыть">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="button" class="btn-primary" id="btn-decrypt" data-i18n="btn_decrypt">Расшифровать</button>

      <div id="receiver-msg" class="status-msg hidden"></div>

      <div id="reveal-area" class="field-group hidden" style="margin-top:1.25rem;">
        <label data-i18n="label_hold">Удерживайте для просмотра (Tap & Hold)</label>
        <div class="tap-box" id="secret-box" data-i18n="tap_to_view">Нажмите и удерживайте</div>
        <div class="btn-row" style="margin-top:0.75rem;">
          <button type="button" class="btn-sm" id="btn-copy-secret">
            <span id="btn-copy-text" data-i18n="btn_copy">Копировать в буфер</span>
          </button>
          <button type="button" class="btn-sm btn-danger" id="btn-purge" data-i18n="btn_purge">Удалить сейчас</button>
        </div>
        <div class="meta-row" style="margin-top:0.5rem;">
          <span id="timer-receiver">Уничтожение через: 30 с</span>
        </div>
      </div>

      <a href="javascript:void(0)" class="nav-link" id="btn-switch-to-sender" data-i18n="btn_switch_sender">Создать свой защищенный QRsec</a>
    </section>
  </section>

  <!-- ==================== FILE MODE ==================== -->
  <section id="file-mode" class="hidden">
    <div class="btn-row role-switch">
      <button type="button" class="btn-sm active" id="frole-send" data-i18n="file_role_send">Отправить файл</button>
      <button type="button" class="btn-sm" id="frole-recv" data-i18n="file_role_recv">Получить файл</button>
    </div>

    <!-- SEND -->
    <div id="fsend-ui">
      <div class="field-group">
        <label for="file-input" data-i18n="label_file">Файл</label>
        <input type="file" id="file-input">
        <div class="meta-row"><span id="file-meta"></span></div>
      </div>

      <div class="field-group">
        <label for="fpass-input" data-i18n="label_pass">Код доступа</label>
        <div class="input-with-action">
          <input type="password" id="fpass-input" data-i18n-ph="ph_pass" placeholder="Код или фраза" autocomplete="new-password">
          <button type="button" class="btn-toggle-eye" id="toggle-fpass-btn" title="Показать/скрыть">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <div class="btn-row">
          <button type="button" class="btn-sm" id="fgen-pin-6">PIN 6</button>
          <button type="button" class="btn-sm" id="fgen-pin-8">PIN 8</button>
          <button type="button" class="btn-sm" id="fgen-word-8">Text PIN</button>
        </div>
      </div>

      <button type="button" class="btn-primary" id="btn-pair" data-i18n="btn_pair_qr">Сформировать QR спаривания</button>
      <div id="fsend-error" class="status-msg status-error hidden"></div>

      <div id="pair-output" class="hidden">
        <div class="qr-frame" id="pair-qr-target"></div>
        <p id="pair-qr-note" class="status-msg status-info hidden" style="margin-top:0; margin-bottom:1rem;" data-i18n="pair_qr_too_big"></p>

        <textarea id="pair-link-out" readonly rows="3"></textarea>
        <div class="btn-row">
          <button type="button" class="btn-sm" id="btn-copy-pairlink"><span id="btn-copy-pairlink-text" data-i18n="btn_copy_link">Копировать ссылку</span></button>
          <button type="button" class="btn-sm btn-danger" id="btn-fsend-reset" data-i18n="btn_reset_file">Начать заново</button>
        </div>

        <label for="answer-input" style="margin-top:1.25rem;" data-i18n="label_answer_paste">Ответный код получателя (w2....)</label>
        <textarea id="answer-input" rows="3" data-i18n-ph="ph_answer" placeholder="w2...."></textarea>
        <button type="button" class="btn-primary" id="btn-connect-answer" style="margin-top:0.5rem;" data-i18n="btn_connect_answer">Подключить и передать</button>
      </div>

      <div id="fsend-progress-area" class="hidden" style="margin-top:1.25rem;">
        <div class="progress"><div id="fsend-bar"></div></div>
        <div class="meta-row"><span id="fsend-status"></span></div>
      </div>
    </div>

    <!-- RECEIVE -->
    <div id="frecv-ui" class="hidden">
      <p id="frecv-incoming-note" class="status-msg status-info hidden" style="margin-top:0; margin-bottom:1.25rem;" data-i18n="recv_incoming_note"></p>

      <div class="field-group" id="frecv-manual-offer-group">
        <label for="frecv-offer-input" data-i18n="label_offer_paste">Ссылка или код отправителя (#w1....)</label>
        <textarea id="frecv-offer-input" rows="2" data-i18n-ph="ph_offer" placeholder="Вставьте ссылку или w1...."></textarea>
      </div>

      <div class="field-group">
        <label for="frecv-code-input" data-i18n="label_recv_code">Код доступа к файлу</label>
        <div class="input-with-action">
          <input type="password" id="frecv-code-input" data-i18n-ph="ph_unlock" placeholder="Введите код" autocomplete="current-password">
          <button type="button" class="btn-toggle-eye" id="toggle-frecv-btn" title="Показать/скрыть">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="button" class="btn-primary" id="btn-create-answer" data-i18n="btn_create_answer">Создать ответный код</button>

let currentLang = 'ru';
const savedLang = localStorage.getItem('qrsec_lang');
if (savedLang && I18N_DATA[savedLang]) {
  currentLang = savedLang;
} else {
  const navLang = (navigator.language || '').toLowerCase();
  if (navLang.startsWith('zh')) currentLang = 'zh';
  else if (navLang.startsWith('en')) currentLang = 'en';
}

function t(key, vars = {}) {
  let str = (I18N_DATA[currentLang] && I18N_DATA[currentLang][key]) || I18N_DATA['ru'][key] || key;
  for (const [k, v] of Object.entries(vars)) {
    str = str.replace(`{${k}}`, v);
  }
  return str;
}

function applyLocale() {
  document.documentElement.lang = currentLang;
  
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    el.innerHTML = t(k);
  });

  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const k = el.getAttribute('data-i18n-ph');
    el.setAttribute('placeholder', t(k));
  });

  document.getElementById('footer-p1').innerHTML = t('footer_p1');
  document.getElementById('footer-p2').innerHTML = t('footer_p2');
  document.getElementById('footer-p3').innerHTML = t('footer_p3');
  document.getElementById('footer-p4').innerHTML = t('footer_p4');

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-lang') === currentLang);
  });

  updateBytesCounter();
  if (secretBox && !secretBox.classList.contains('revealed')) {
    secretBox.innerText = t('tap_to_view');
  }
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.onclick = () => {
    const l = btn.getAttribute('data-lang');
    if (l && I18N_DATA[l]) {
      currentLang = l;
      localStorage.setItem('qrsec_lang', l);
      applyLocale();
    }
  };
});

const B64 = {
  encode: (buf) => {
    const bytes = new Uint8Array(buf);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  },
  decode: (str) => {
    let s = str.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    const bin = atob(s);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }
};

// Генерация случайной строки без modulo bias (rejection sampling)
function randomString(length, alphabet) {
  const maxValid = 256 - (256 % alphabet.length);
  let out = '';
  const buf = new Uint8Array(length * 2);
  while (out.length < length) {
    crypto.getRandomValues(buf);
    for (let i = 0; i < buf.length && out.length < length; i++) {
      if (buf[i] < maxValid) {
        out += alphabet[buf[i] % alphabet.length];
      }
    }
  }
  return out;
}

async function deriveKey(passphrase, salt) {
  const enc = new TextEncoder();
  const rawKey = await crypto.subtle.importKey(
    'raw',
    enc.encode(passphrase),
    'PBKDF2',
    false,
    ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    {
      name: 'PBKDF2',
      salt,
      iterations: 600000,
      hash: 'SHA-256'
    },
    rawKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encrypt(secretText, passphrase) {
  const enc = new TextEncoder();
  const secretBytes = enc.encode(secretText);
  if (secretBytes.length > 1024) throw new Error(t('err_limit'));

  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(passphrase, salt);

  const ctBuffer = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv },
    key,
    secretBytes
  );

  const ctBytes = new Uint8Array(ctBuffer);
  const packet = new Uint8Array(1 + 16 + 12 + ctBytes.length);
  packet[0] = 0x01;
  packet.set(salt, 1);
  packet.set(iv, 1 + 16);
  packet.set(ctBytes, 1 + 16 + 12);

  return 'nd1.' + B64.encode(packet.buffer);
}

async function decrypt(payloadStr, passphrase) {
  if (!payloadStr.startsWith('nd1.')) throw new Error('InvalidKeyError');
  const rawB64 = payloadStr.slice(4);
  const packet = new Uint8Array(B64.decode(rawB64));

  if (packet.length < 1 + 16 + 12 + 16) throw new Error('InvalidKeyError');
  if (packet[0] !== 0x01) throw new Error('InvalidKeyError');

  const salt = packet.subarray(1, 17);
  const iv = packet.subarray(17, 29);
  const ct = packet.subarray(29);

  const key = await deriveKey(passphrase, salt);
  try {
    const ptBuffer = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv },
      key,
      ct
    );
    return new TextDecoder().decode(ptBuffer);
  } catch {
    throw new Error('InvalidKeyError');
  }
}

function fmtSize(n) {
  if (n >= 1048576) return (n / 1048576).toFixed(2) + ' MB';
  if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
  return n + ' B';
}

function bytesToHex(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i++) s += u8[i].toString(16).padStart(2, '0');
  return s;
}

function waitIceGathering(pc, timeoutMs = 8000) {
  return new Promise(resolve => {
    if (pc.iceGatheringState === 'complete') return resolve();
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      pc.removeEventListener('icegatheringstatechange', onState);
      pc.removeEventListener('icecandidate', onCand);
      resolve();
    };
    const onState = () => {
      if (pc.iceGatheringState === 'complete') finish();
    };
    const onCand = (e) => {
      if (!e.candidate) finish();
    };
    pc.addEventListener('icegatheringstatechange', onState);
    pc.addEventListener('icecandidate', onCand);
    setTimeout(finish, timeoutMs);
  });
}

function hasIceCandidates(sdp) {
  return typeof sdp === 'string' && (sdp.includes('a=candidate:') || sdp.includes('a=candidate '));
}

function sdpToFragment(prefix, sdp) {
  return prefix + B64.encode(new TextEncoder().encode(sdp));
}

function fragmentToSdp(inputStr, prefix) {
  let clean = inputStr.trim();
  const hashIdx = clean.indexOf('#' + prefix);
  if (hashIdx !== -1) {
    clean = clean.slice(hashIdx + 1);
  }
  if (!clean.startsWith(prefix)) throw new Error('InvalidKeyError');
  return new TextDecoder().decode(new Uint8Array(B64.decode(clean.slice(prefix.length))));
}

function waitForChannelDrain(dc) {
  return new Promise((resolve, reject) => {
    if (dc.readyState !== 'open') return reject(new Error(t('err_webrtc_connect')));
    if (dc.bufferedAmount <= BUFFER_HIGH_WATERMARK) return resolve();
    const onLow = () => {
      cleanup();
      resolve();
    };
    const onClose = () => {
      cleanup();
      reject(new Error(t('err_webrtc_connect')));
    };
    const cleanup = () => {
      dc.removeEventListener('bufferedamountlow', onLow);
      dc.removeEventListener('close', onClose);
      dc.removeEventListener('error', onClose);
    };
    dc.addEventListener('bufferedamountlow', onLow);
    dc.addEventListener('close', onClose);
    dc.addEventListener('error', onClose);
  });
}

async function startFsendTransfer() {
  try {
    setFsendStatus(t('status_hashing'));
    const buf = await fsendFile.arrayBuffer();
    const shaHex = bytesToHex(new Uint8Array(await crypto.subtle.digest('SHA-256', buf)));
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const key = await deriveKey(fsendPass, salt);

    // Зашифрованный проверочный тег в заголовке для мгновенной проверки пароля
    const authIv = crypto.getRandomValues(new Uint8Array(12));
    const authCt = new Uint8Array(await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv: authIv },
      key,
      new TextEncoder().encode('QRSEC_OK')
    ));

    fdc.send(JSON.stringify({
      t: 'hdr',
      name: fsendFile.name,
      size: buf.byteLength,
      sha256: shaHex,
      salt: B64.encode(salt.buffer),
      authIv: B64.encode(authIv.buffer),
      authCt: B64.encode(authCt.buffer)
    }));

    let off = 0;
    while (off < buf.byteLength) {
      await waitForChannelDrain(fdc);
      const len = Math.min(F_CHUNK, buf.byteLength - off);
      const chunk = new Uint8Array(buf, off, len);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, chunk));
      const msg = new Uint8Array(12 + ct.byteLength);
      msg.set(iv, 0);
      msg.set(ct, 12);
      fdc.send(msg.buffer);
      off += len;
      const pct = buf.byteLength > 0 ? Math.floor((off / buf.byteLength) * 100) : 100;
      fsendBar.style.width = pct + '%';
      setFsendStatus(t('status_sending', { p: pct }));
    }

    fdc.send(JSON.stringify({ t: 'end' }));
    fsendBar.style.width = '100%';
    setFsendStatus(t('msg_sent_done'));
    fsendPass = ''; // стирание кода после передачи
  } catch (err) {
    setFsendStatus(err.message || t('err_webrtc_connect'));
  }
}

const btnCreateAnswer = document.getElementById('btn-create-answer');
const frecvError = document.getElementById('frecv-error');
const frecvIncomingNote = document.getElementById('frecv-incoming-note');
const frecvAnswerArea = document.getElementById('frecv-answer-area');
const answerOut = document.getElementById('answer-out');
const frecvStatusEl = document.getElementById('frecv-status');
const frecvProgressArea = document.getElementById('frecv-progress-area');
const frecvBar = document.getElementById('frecv-bar');
const frecvFileMeta = document.getElementById('frecv-file-meta');
const frecvDoneArea = document.getElementById('frecv-done-area');
const btnDownloadFile = document.getElementById('btn-download-file');

toggleFrecvBtn.onclick = () => toggleFieldVisibility(frecvCodeInput);

let frecvKey = null;
let frecvName = '';
let frecvSize = 0;
let frecvSha = '';
let frecvChunks = [];
let frecvGot = 0;
let frecvChain = Promise.resolve();
let frecvBlobUrl = null;
let frecvFailed = false;

function setFrecvStatus(msg) {
  frecvStatusEl.innerText = msg;
  frecvStatusEl.classList.remove('hidden');
}

btnCreateAnswer.onclick = async () => {
  frecvError.classList.add('hidden');
  if (!frecvCodeInput.value) {
    frecvError.innerText = t('err_code_required');
    frecvError.classList.remove('hidden');
    return;
  }
  if (window.location.protocol === 'file:') {
    frecvError.innerText = t('err_file_protocol');
    frecvError.classList.remove('hidden');
    return;
  }
  if (!window.RTCPeerConnection) {
    frecvError.innerText = t('err_no_webrtc');
    frecvError.classList.remove('hidden');
    return;
  }

  let offerSdp = capturedOfferSdp;
  if (!offerSdp && frecvOfferInput.value.trim()) {
    try {
      offerSdp = fragmentToSdp(frecvOfferInput.value.trim(), 'w1.');
    } catch {
      frecvError.innerText = t('err_no_offer');
      frecvError.classList.remove('hidden');
      return;
    }
  }

  if (!offerSdp) {
    frecvError.innerText = t('err_no_offer');
    frecvError.classList.remove('hidden');
    return;
  }

  teardownFpc();
  frecvFailed = false;
  frecvChain = Promise.resolve();
  btnCreateAnswer.disabled = true;

  try {
    fpc = new RTCPeerConnection(RTC_CONFIG);
    fpc.addEventListener('icecandidate', (e) => {
      if (e.candidate) gatheredCandidatesDebug.push((e.candidate.type || '?') + '/' + (e.candidate.address || 'mDNS'));
    });

    fpc.onconnectionstatechange = () => {
      if (!fpc) return;
      if (fpc.connectionState === 'connected') setFrecvStatus(t('status_connected_wait_file'));
      else if ((fpc.connectionState === 'failed' || fpc.connectionState === 'disconnected') && frecvDoneArea.classList.contains('hidden')) { // не показываем ошибку после успешного приёма
        if (!frecvFailed) {
          frecvError.innerText = t('err_webrtc_connect');
          frecvError.classList.remove('hidden');
        }
      }
    };
    fpc.ondatachannel = (e) => wireReceiverChannel(e.channel);

    await fpc.setRemoteDescription({ type: 'offer', sdp: offerSdp });
    await fpc.setLocalDescription(await fpc.createAnswer());
    setFrecvStatus(t('status_ice'));
    await waitIceGathering(fpc);

    const localSdp = fpc.localDescription ? fpc.localDescription.sdp : '';
    if (!hasIceCandidates(localSdp)) {
      teardownFpc();
      frecvError.innerText = t('err_no_ice');
      frecvError.classList.remove('hidden');
      return;
    }

    answerOut.value = sdpToFragment('w2.', localSdp);
    frecvAnswerArea.classList.remove('hidden');
    setFrecvStatus(t('status_send_answer_hint'));
  } catch (err) {
    frecvError.innerText = err.message || t('err_webrtc_connect');
    frecvError.classList.remove('hidden');
  } finally {
    btnCreateAnswer.disabled = false;
  }
};

function wireReceiverChannel(dc) {
  dc.binaryType = 'arraybuffer';
  dc.onmessage = (e) => {
    if (frecvFailed) return;
    if (typeof e.data === 'string') {
      let m;
      try { m = JSON.parse(e.data); } catch { return; }
      if (m.t === 'hdr') {
        frecvChain = frecvChain.then(() => onFrecvHeader(m)).catch(showFrecvFatal);
      } else if (m.t === 'end') {
        frecvChain = frecvChain.then(frecvFinalize).catch(showFrecvFatal);
      }
    } else {
      const data = e.data;
      frecvChain = frecvChain.then(() => processFrecvChunk(data)).catch(showFrecvFatal);
    }
  };
}

async function onFrecvHeader(m) {
  if (!m || m.t !== 'hdr') return;
  try {
    const salt = new Uint8Array(B64.decode(m.salt));
    frecvKey = await deriveKey(frecvCodeInput.value, salt);

    if (m.authIv && m.authCt) {
      const authIv = new Uint8Array(B64.decode(m.authIv));
      const authCt = new Uint8Array(B64.decode(m.authCt));
      await crypto.subtle.decrypt({ name: 'AES-GCM', iv: authIv }, frecvKey, authCt);
    }

    frecvName = String(m.name || 'qrsec-file');
    frecvSize = Number(m.size) || 0;
    frecvSha = String(m.sha256 || '').toLowerCase();
    frecvChunks = [];
    frecvGot = 0;
    frecvFileMeta.innerText = `${frecvName} — ${fmtSize(frecvSize)}`;
    frecvBar.style.width = '0%';
    frecvProgressArea.classList.remove('hidden');
    setFrecvStatus(t('status_receiving', { p: 0 }));
  } catch {
    throw new Error('WRONGCODE');
  }
}

async function processFrecvChunk(data) {
  if (!frecvKey) return;
  const u8 = new Uint8Array(data);
  let pt;
  try {
    pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8.subarray(0, 12) }, frecvKey, u8.subarray(12));
  } catch {
    throw new Error('WRONGCODE');
  }
  const bytes = new Uint8Array(pt);
  frecvChunks.push(bytes);
  frecvGot += bytes.byteLength;
  if (frecvSize > 0) {
    const pct = Math.floor((frecvGot / frecvSize) * 100);
    frecvBar.style.width = pct + '%';
    setFrecvStatus(t('status_receiving', { p: pct }));
  }
}

async function frecvFinalize() {
  setFrecvStatus(t('status_verifying'));
  const out = new Uint8Array(frecvSize);
  let off = 0;
  for (const c of frecvChunks) {
    out.set(c, off);
    off += c.byteLength;
  }
  if (off !== frecvSize) throw new Error(t('err_sha_mismatch'));
  const hex = bytesToHex(new Uint8Array(await crypto.subtle.digest('SHA-256', out)));
  if (hex !== frecvSha) throw new Error(t('err_sha_mismatch'));

  frecvBar.style.width = '100%';
  frecvBlobUrl = URL.createObjectURL(new Blob([out], { type: 'application/octet-stream' }));
  btnDownloadFile.href = frecvBlobUrl;
  btnDownloadFile.download = frecvName;
  frecvDoneArea.classList.remove('hidden');
  setFrecvStatus(t('msg_recv_done'));
}

function showFrecvFatal(err) {
  if (frecvFailed) return;
  frecvFailed = true;
  teardownFpc();
  const msg = (err && err.message === 'WRONGCODE') ? t('err_wrong_code_file') : ((err && err.message) || t('err_webrtc_connect'));
  frecvError.innerText = msg;
  frecvError.classList.remove('hidden');
}

document.getElementById('btn-copy-answer').onclick = () => copyToClipboard(answerOut.value, 'btn-copy-answer-text');
document.getElementById('btn-fpurge').onclick = () => {
  if (frecvBlobUrl) URL.revokeObjectURL(frecvBlobUrl);
  frecvBlobUrl = null;
  frecvChunks = [];
  frecvKey = null;
  frecvGot = 0;
  frecvDoneArea.classList.add('hidden');
  frecvProgressArea.classList.add('hidden');
  setFrecvStatus(t('msg_file_purged'));
};
document.getElementById('btn-frecv-reset').onclick = resetFTransfer;

/* ---------- ОБЩИЕ ВСПОМОГАТЕЛЬНЫЕ / СБРОС ---------- */

async function copyToClipboard(text, spanId) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    prompt(t('prompt_copy'), text);
    return;
  }
  const span = document.getElementById(spanId);
  if (span) {
    const old = span.innerText;
    span.innerText = t('btn_copied');
    setTimeout(() => { span.innerText = old; }, 2000);
  }
}

function resetFTransfer() {
  teardownFpc();
  fsendFile = null;
  fsendPass = '';
  pairUrl = '';
  frecvKey = null;
  frecvName = '';
  frecvSize = 0;
  frecvSha = '';
  frecvChunks = [];
  frecvGot = 0;
  frecvChain = Promise.resolve();
  frecvFailed = false;
  if (frecvBlobUrl) { URL.revokeObjectURL(frecvBlobUrl); frecvBlobUrl = null; }

  pairQrTarget.innerHTML = '';
  pairOutput.classList.add('hidden');
  answerInput.value = '';
  fsendProgressArea.classList.add('hidden');
  fsendBar.style.width = '0%';
  setFsendStatus('');
  fsendError.classList.add('hidden');

  frecvAnswerArea.classList.add('hidden');
  answerOut.value = '';
  frecvStatusEl.classList.add('hidden');
  frecvProgressArea.classList.add('hidden');
  frecvBar.style.width = '0%';
  frecvDoneArea.classList.add('hidden');
  frecvError.classList.add('hidden');
}

/* ---------- ИНИЦИАЛИЗАЦИЯ: входящий offer в URL-фрагменте ---------- */

if (capturedOfferSdp) {
  showMode('file');
  showFRole('recv');
  frecvIncomingNote.classList.remove('hidden');
  frecvManualOfferGroup.classList.add('hidden');
}

// Хук для автотестов/автоматизации (только чтение, без секретов)
window.__qrsecDebug = {
  get textUrl() { return generatedUrl; },
  get pairUrl() { return pairUrl; },
  get pcState() {
    if (!fpc) return null;
    return {
      conn: fpc.connectionState,
      ice: fpc.iceConnectionState,
      gathering: fpc.iceGatheringState,
      candidates: gatheredCandidatesDebug.slice()
    };
  },
  get dcReady() { return fdc ? fdc.readyState : null; }
};

// Инициализация выбранного языка
applyLocale();
</script>
